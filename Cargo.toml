[package]
name = "monolith"
version = "0.0.1"
authors = ["zhongyang.wu <zhongyang.wu@outlook.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/tommycpp/monolith.git"
keywords = ["timeseries", "tsdb", "prometheus", "sled"]
description = "timeseries database that could used as promtheus remote write endpoint, support both slec or tikv"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
sled = "0.34"
tempfile = "3"
protobuf = "2"
tiny_http = "0.12"
crc = "3"
env_logger = "0.11"
snap = "1"
rayon = "1"
rand = "0.9"
serde_json = "1"
serde_yaml = "0.9"
futures = { version = "0.3", features = ["executor", "thread-pool"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
tikv-client = { git = "https://github.com/tikv/client-rust.git" }

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false



